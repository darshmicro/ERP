# GMP-MERP reference stack. Secrets come from environment / .env (never committed).
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set in .env}
    volumes: [mssql-data:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 15s
      retries: 10
  api:
    build: { context: .., dockerfile: docker/Dockerfile }
    env_file: ../.env
    depends_on: { mssql: { condition: service_healthy } }
    volumes: [documents:/data/documents, logs:/data/logs]
    expose: ["8000"]
  proxy:
    image: caddy:2
    ports: ["443:443", "80:80"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data]
    depends_on: [api]
volumes: { mssql-data: {}, documents: {}, logs: {}, caddy-data: {} }
