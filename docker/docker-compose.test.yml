# Repeatable SQL Server test target for the automated suite:
#   docker compose -f docker/docker-compose.test.yml up -d
#   MERP_TEST_DATABASE_URL='mssql+pyodbc://sa:<pw>@localhost:1433/MERP_TEST?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes' python -m pytest
services:
  mssql-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set in environment}
    ports: ["1433:1433"]
